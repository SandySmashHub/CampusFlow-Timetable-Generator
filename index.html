<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusFlow – College Timetable Generator</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════════════════════════ */
:root {
  --c-primary:   #4f46e5;
  --c-primary-d: #3730a3;
  --c-primary-l: #e0e7ff;
  --c-success:   #059669;
  --c-success-l: #d1fae5;
  --c-warn:      #d97706;
  --c-warn-l:    #fef3c7;
  --c-danger:    #dc2626;
  --c-danger-l:  #fee2e2;
  --c-info:      #0284c7;
  --c-info-l:    #e0f2fe;
  --c-surf:      #ffffff;
  --c-bg:        #f1f5f9;
  --c-border:    #e2e8f0;
  --c-text:      #1e293b;
  --c-muted:     #64748b;
  --c-lecture:   #4f46e5;
  --c-practical: #059669;
  --c-break:     #94a3b8;
  --c-lunch:     #f59e0b;
  --c-free:      #f8fafc;
  --radius:      8px;
  --shadow:      0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md:   0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
}
/* ═══════════════════════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--c-bg);color:var(--c-text);min-height:100vh;display:flex;flex-direction:column}
a{color:var(--c-primary);text-decoration:none}
button{cursor:pointer;font:inherit}
input,select,textarea{font:inherit}
table{border-collapse:collapse;width:100%}
/* ═══════════════════════════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════════════════════════ */
#app-header{background:var(--c-primary);color:#fff;padding:0 1.5rem;display:flex;align-items:center;gap:1rem;height:56px;box-shadow:var(--shadow-md);position:sticky;top:0;z-index:100}
#app-header h1{font-size:1.2rem;font-weight:700;letter-spacing:.5px;white-space:nowrap}
#app-header .tagline{font-size:.78rem;opacity:.8;display:none}
@media(min-width:640px){#app-header .tagline{display:block}}
#header-actions{margin-left:auto;display:flex;gap:.5rem;align-items:center}

#layout{display:flex;flex:1;overflow:hidden}
#sidebar{width:220px;background:var(--c-surf);border-right:1px solid var(--c-border);display:flex;flex-direction:column;gap:2px;padding:.75rem .5rem;flex-shrink:0}
#sidebar.collapsed{width:56px}
#main-content{flex:1;overflow-y:auto;padding:1.5rem}

/* Sidebar nav */
.nav-item{display:flex;align-items:center;gap:.6rem;padding:.5rem .75rem;border-radius:var(--radius);cursor:pointer;font-size:.88rem;color:var(--c-muted);transition:.15s;white-space:nowrap;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--c-primary-l);color:var(--c-primary)}
.nav-item.active{background:var(--c-primary-l);color:var(--c-primary);font-weight:600}
.nav-icon{font-size:1.1rem;flex-shrink:0;width:20px;text-align:center}
.nav-label{overflow:hidden;text-overflow:ellipsis}
#sidebar.collapsed .nav-label{display:none}
.nav-section{font-size:.7rem;text-transform:uppercase;color:var(--c-muted);letter-spacing:.05em;padding:.4rem .75rem .2rem;font-weight:600;white-space:nowrap;overflow:hidden}
#sidebar.collapsed .nav-section{visibility:hidden}

/* Cards */
.card{background:var(--c-surf);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.25rem;margin-bottom:1rem}
.card-title{font-size:1rem;font-weight:700;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}
.card-title .icon{font-size:1.2rem}

/* Stats grid */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin-bottom:1rem}
.stat-card{background:var(--c-surf);border-radius:var(--radius);box-shadow:var(--shadow);padding:1rem;border-left:3px solid var(--c-primary)}
.stat-card.green{border-color:var(--c-success)}
.stat-card.amber{border-color:var(--c-warn)}
.stat-card.red{border-color:var(--c-danger)}
.stat-card.sky{border-color:var(--c-info)}
.stat-value{font-size:1.6rem;font-weight:700;color:var(--c-text)}
.stat-label{font-size:.75rem;color:var(--c-muted);margin-top:.2rem}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .9rem;border-radius:var(--radius);border:none;font-size:.85rem;font-weight:600;transition:.15s;cursor:pointer;white-space:nowrap}
.btn-primary{background:var(--c-primary);color:#fff}
.btn-primary:hover{background:var(--c-primary-d)}
.btn-success{background:var(--c-success);color:#fff}
.btn-success:hover{background:#047857}
.btn-warn{background:var(--c-warn);color:#fff}
.btn-warn:hover{background:#b45309}
.btn-danger{background:var(--c-danger);color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-ghost{background:transparent;color:var(--c-primary);border:1px solid var(--c-primary)}
.btn-ghost:hover{background:var(--c-primary-l)}
.btn-sm{padding:.3rem .65rem;font-size:.78rem}
.btn-xs{padding:.2rem .5rem;font-size:.72rem}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Forms */
.form-row{display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:.75rem}
.form-group{display:flex;flex-direction:column;gap:.3rem;flex:1;min-width:140px}
.form-group.full{flex-basis:100%}
label{font-size:.78rem;font-weight:600;color:var(--c-muted)}
input[type=text],input[type=number],input[type=email],select,textarea{
  padding:.45rem .7rem;border:1px solid var(--c-border);border-radius:var(--radius);
  background:#fff;color:var(--c-text);font-size:.85rem;transition:.15s;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--c-primary);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
input.error{border-color:var(--c-danger)}
.field-error{font-size:.72rem;color:var(--c-danger);margin-top:.15rem}

/* Tables */
.data-table{width:100%;border:1px solid var(--c-border);border-radius:var(--radius);overflow:hidden}
.data-table th{background:#f8fafc;font-size:.75rem;font-weight:700;color:var(--c-muted);text-transform:uppercase;letter-spacing:.04em;padding:.5rem .75rem;text-align:left;border-bottom:1px solid var(--c-border)}
.data-table td{padding:.55rem .75rem;font-size:.83rem;border-bottom:1px solid var(--c-border);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:#f8fafc}
.badge{display:inline-block;padding:.15rem .5rem;border-radius:20px;font-size:.72rem;font-weight:600}
.badge-lecture{background:var(--c-primary-l);color:var(--c-primary)}
.badge-practical{background:var(--c-success-l);color:var(--c-success)}
.badge-classroom{background:#ede9fe;color:#7c3aed}
.badge-lab{background:#d1fae5;color:#065f46}
.badge-warn{background:var(--c-warn-l);color:var(--c-warn)}
.badge-danger{background:var(--c-danger-l);color:var(--c-danger)}
.badge-success{background:var(--c-success-l);color:var(--c-success)}
.badge-info{background:var(--c-info-l);color:var(--c-info)}

/* Timetable grid */
.tt-wrap{overflow-x:auto}
.tt-grid{min-width:700px;border:1px solid var(--c-border);border-radius:var(--radius);overflow:hidden}
.tt-grid table th{background:#f8fafc;font-size:.72rem;text-align:center;padding:.4rem .3rem;border:1px solid var(--c-border)}
.tt-grid table td{font-size:.75rem;padding:.25rem;border:1px solid var(--c-border);vertical-align:top;min-width:90px;height:60px}
.tt-cell-lecture{background:var(--c-primary-l);border-left:3px solid var(--c-lecture);border-radius:4px;padding:.2rem .3rem;height:100%;cursor:pointer;transition:.15s}
.tt-cell-lecture:hover{filter:brightness(.95)}
.tt-cell-practical{background:var(--c-success-l);border-left:3px solid var(--c-practical);border-radius:4px;padding:.2rem .3rem;height:100%;cursor:pointer;transition:.15s}
.tt-cell-practical:hover{filter:brightness(.95)}
.tt-cell-break{background:#f1f5f9;text-align:center;font-size:.7rem;color:var(--c-muted);padding:.3rem;border-radius:4px;height:100%}
.tt-cell-lunch{background:#fef3c7;text-align:center;font-size:.7rem;color:var(--c-warn);padding:.3rem;border-radius:4px;height:100%}
.tt-cell-free{height:100%;background:var(--c-free)}
.tt-subj{font-weight:700;font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c-primary)}
.tt-practical .tt-subj{color:var(--c-success)}
.tt-detail{font-size:.65rem;color:var(--c-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-period-label{font-size:.65rem;font-weight:600;color:var(--c-muted);text-align:center;white-space:nowrap}

/* Alert boxes */
.alert{display:flex;gap:.6rem;padding:.75rem 1rem;border-radius:var(--radius);font-size:.84rem;margin-bottom:.75rem;align-items:flex-start}
.alert-icon{font-size:1.1rem;flex-shrink:0;margin-top:.05rem}
.alert-success{background:var(--c-success-l);border:1px solid #6ee7b7;color:#065f46}
.alert-warn{background:var(--c-warn-l);border:1px solid #fcd34d;color:#92400e}
.alert-danger{background:var(--c-danger-l);border:1px solid #fca5a5;color:#991b1b}
.alert-info{background:var(--c-info-l);border:1px solid #7dd3fc;color:#075985}

/* Modal */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;padding:1rem}
.modal-backdrop.open{display:flex}
.modal{background:var(--c-surf);border-radius:var(--radius);box-shadow:0 20px 25px rgba(0,0,0,.15);max-width:560px;width:100%;max-height:90vh;overflow-y:auto}
.modal-header{padding:1rem 1.25rem;border-bottom:1px solid var(--c-border);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:1rem;font-weight:700}
.modal-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--c-muted)}
.modal-body{padding:1.25rem}
.modal-footer{padding:.75rem 1.25rem;border-top:1px solid var(--c-border);display:flex;gap:.5rem;justify-content:flex-end}

/* Tabs */
.tabs{display:flex;gap:.25rem;border-bottom:2px solid var(--c-border);margin-bottom:1rem;overflow-x:auto}
.tab{padding:.45rem .9rem;font-size:.85rem;font-weight:600;color:var(--c-muted);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.active{color:var(--c-primary);border-bottom-color:var(--c-primary)}
.tab:hover{color:var(--c-primary)}

/* Toggle switch */
.toggle-wrap{display:flex;align-items:center;gap:.5rem}
.toggle{position:relative;width:36px;height:20px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#cbd5e1;border-radius:20px;transition:.2s;cursor:pointer}
.toggle-slider::before{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;left:2px;top:2px;transition:.2s}
.toggle input:checked+.toggle-slider{background:var(--c-primary)}
.toggle input:checked+.toggle-slider::before{transform:translateX(16px)}

/* Page header */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap}
.page-title{font-size:1.3rem;font-weight:800}
.page-sub{font-size:.82rem;color:var(--c-muted);margin-top:.15rem}
.page-actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}

/* Chip */
.chip{display:inline-flex;align-items:center;gap:.25rem;background:var(--c-primary-l);color:var(--c-primary);border-radius:20px;padding:.15rem .5rem;font-size:.72rem;font-weight:600}
.chip-remove{cursor:pointer;font-size:.9rem;line-height:1}

/* Progress */
.progress-bar{height:6px;background:var(--c-border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--c-primary);border-radius:3px;transition:.4s}
.progress-fill.green{background:var(--c-success)}
.progress-fill.amber{background:var(--c-warn)}

/* Availability grid */
.avail-grid{display:grid;grid-template-columns:80px repeat(5,1fr);gap:2px;font-size:.72rem}
.avail-header{font-weight:700;text-align:center;padding:.3rem;background:#f8fafc;border-radius:4px}
.avail-period{font-size:.65rem;color:var(--c-muted);display:flex;align-items:center}
.avail-cell{display:flex;align-items:center;justify-content:center}
.avail-cell input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--c-danger)}

/* Validation error list */
.err-list{list-style:none;display:flex;flex-direction:column;gap:.35rem}
.err-item{display:flex;gap:.4rem;align-items:flex-start;font-size:.8rem}
.err-code{font-size:.65rem;font-weight:700;background:var(--c-danger-l);color:var(--c-danger);border-radius:4px;padding:.1rem .3rem;flex-shrink:0;margin-top:.1rem}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}

/* Spinner */
.spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Print */
@media print{
  #app-header,#sidebar,#header-actions,#non-print{display:none!important}
  #main-content{padding:0}
  .card{box-shadow:none;border:1px solid #ddd}
  .btn{display:none}
  .page-actions{display:none}
  .tabs{display:none}
  #print-area{display:block!important}
}
#print-area{display:none}

/* Empty state */
.empty-state{text-align:center;padding:3rem 1rem;color:var(--c-muted)}
.empty-icon{font-size:3rem;margin-bottom:.75rem}
.empty-title{font-size:1rem;font-weight:700;margin-bottom:.35rem}
.empty-sub{font-size:.84rem}

/* Responsive sidebar */
@media(max-width:768px){
  #sidebar{display:none}
  #sidebar.open{display:flex;position:fixed;left:0;top:56px;bottom:0;z-index:50;box-shadow:var(--shadow-md)}
  #main-content{padding:1rem}
}
</style>
</head>

<!-- ═══════════════════════════════════════════════════════
     HEADER
═══════════════════════════════════════════════════════ -->
<header id="app-header">
  <button id="sidebar-toggle" class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.3)" aria-label="Toggle sidebar">☰</button>
  <h1>🎓 CampusFlow</h1>
  <span class="tagline">College Timetable Generator</span>
  <div id="header-actions">
    <button class="btn btn-sm" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)" onclick="exportJSON()" title="Export all data as JSON">⬇ Export</button>
    <label class="btn btn-sm" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)" title="Import JSON data">
      ⬆ Import<input type="file" accept=".json" style="display:none" onchange="importJSON(event)">
    </label>
    <button class="btn btn-sm" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)" onclick="resetToDemo()" title="Reload demo data">↺ Demo</button>
  </div>
</header>

<!-- ═══════════════════════════════════════════════════════
     LAYOUT
═══════════════════════════════════════════════════════ -->
<div id="layout">
  <!-- SIDEBAR -->
  <nav id="sidebar">
    <span class="nav-section">Overview</span>
    <button class="nav-item active" data-page="dashboard"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></button>

    <span class="nav-section">Setup</span>
    <button class="nav-item" data-page="config"><span class="nav-icon">⚙️</span><span class="nav-label">Configuration</span></button>
    <button class="nav-item" data-page="divisions"><span class="nav-icon">🏫</span><span class="nav-label">Divisions</span></button>
    <button class="nav-item" data-page="subjects"><span class="nav-icon">📚</span><span class="nav-label">Subjects</span></button>
    <button class="nav-item" data-page="faculty"><span class="nav-icon">👩‍🏫</span><span class="nav-label">Faculty</span></button>
    <button class="nav-item" data-page="rooms"><span class="nav-icon">🏛️</span><span class="nav-label">Rooms</span></button>
    <button class="nav-item" data-page="assignments"><span class="nav-icon">🔗</span><span class="nav-label">Assignments</span></button>

    <span class="nav-section">Timetable</span>
    <button class="nav-item" data-page="generate"><span class="nav-icon">⚡</span><span class="nav-label">Generate</span></button>
    <button class="nav-item" data-page="timetable"><span class="nav-icon">📅</span><span class="nav-label">View Timetable</span></button>
    <button class="nav-item" data-page="validate"><span class="nav-icon">✅</span><span class="nav-label">Validation</span></button>

  <!-- MAIN -->
  <main id="main-content">

    <div id="page-root"></div>
  </main>
</div>

<!-- ═══════════════════════════════════════════════════════
     MODAL
═══════════════════════════════════════════════════════ -->
<div id="modal" class="modal-backdrop" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Dialog</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<div id="toast" style="position:fixed;bottom:1rem;right:1rem;z-index:999;display:flex;flex-direction:column;gap:.4rem;pointer-events:none"></div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   ██████  SCHEDULING ENGINE  (verbatim from scheduler.js)
═══════════════════════════════════════════════════════════════ */
function slotKey(day,periodId){return`${day}:${periodId}`}
function indexBy(arr,keyFn){const m=new Map();for(const i of arr)m.set(keyFn(i),i);return m}

function expandTasks(config){
  const{assignments,subjects}=config;
  const sm=indexBy(subjects,s=>s.id);
  const tasks=[];let seq=0;
  for(const a of assignments){
    const s=sm.get(a.subjectId);if(!s)continue;
    for(let i=0;i<s.lecturesPerWeek;i++)tasks.push({id:`T${++seq}`,divisionId:a.divisionId,subjectId:s.id,subjectName:s.name,sessionType:'lecture',facultyId:a.facultyLectureId,requiredRoomType:s.roomType,periodsRequired:1,preferredDays:a.preferredDays||null,preferredPeriods:a.preferredPeriods||null});
    if(s.practicalsPerWeek>0&&a.facultyPracticalId)for(let i=0;i<s.practicalsPerWeek;i++)tasks.push({id:`T${++seq}`,divisionId:a.divisionId,subjectId:s.id,subjectName:s.name,sessionType:'practical',facultyId:a.facultyPracticalId,requiredRoomType:s.labRoomType||'lab',periodsRequired:s.practicalPeriods,preferredDays:a.preferredDays||null,preferredPeriods:a.preferredPeriods||null});
  }
  return tasks;
}

function getConsecutivePeriods(startId,count,schedulablePeriodIds,periodMap){
  const result=[];let cur=startId;
  for(let i=0;i<count;i++){const p=periodMap.get(cur);if(!p||p.type!=='lecture')return null;if(!schedulablePeriodIds.includes(cur))return null;result.push(cur);cur++;}
  for(const id of result){const p=periodMap.get(id);if(!p||p.type!=='lecture')return null;}
  return result;
}

function generateCandidates(task,config,roomMap,facultyMap,periodMap){
  const{workingDays,schedulablePeriodIds}=config;
  const faculty=facultyMap.get(task.facultyId);
  const candidates=[];
  for(const day of workingDays){
    for(const startPeriodId of schedulablePeriodIds){
      if(task.periodsRequired>1&&!getConsecutivePeriods(startPeriodId,task.periodsRequired,schedulablePeriodIds,periodMap))continue;
      const periodIds=task.periodsRequired===1?[startPeriodId]:(getConsecutivePeriods(startPeriodId,task.periodsRequired,schedulablePeriodIds,periodMap)||[]);
      if(!periodIds.length)continue;
      if(faculty&&faculty.blockedSlots){let bl=false;for(const pid of periodIds)if(faculty.blockedSlots.has(slotKey(day,pid))){bl=true;break;}if(bl)continue;}
      for(const room of config.rooms){
        if(room.type!==task.requiredRoomType)continue;
        let rb=false;if(room.blockedSlots){for(const pid of periodIds)if(room.blockedSlots.has(slotKey(day,pid))){rb=true;break;}}if(rb)continue;
        let ps=0;if(task.preferredDays&&!task.preferredDays.includes(day))ps+=10;if(task.preferredPeriods&&!task.preferredPeriods.includes(startPeriodId))ps+=5;
        candidates.push({day,startPeriodId,room,prefScore:ps});
      }
    }
  }
  return candidates;
}

function sortByMCV(tasks,config,roomMap,facultyMap,periodMap){
  const cc=new Map();
  for(const t of tasks)cc.set(t.id,generateCandidates(t,config,roomMap,facultyMap,periodMap).length);
  return[...tasks].sort((a,b)=>{
    const ai=a.sessionType==='practical'?0:1,bi=b.sessionType==='practical'?0:1;
    if(ai!==bi)return ai-bi;
    const d=cc.get(a.id)-cc.get(b.id);if(d!==0)return d;
    return a.id.localeCompare(b.id);
  });
}

function createState(config){
  const dO=new Map(),fO=new Map(),rO=new Map(),dl=new Map(),wl=new Map();
  for(const d of config.divisions)dO.set(d.id,new Set());
  for(const f of config.faculty){fO.set(f.id,new Set());wl.set(f.id,0);for(const day of config.workingDays)dl.set(`${f.id}:${day}`,0);}
  for(const r of config.rooms)rO.set(r.id,new Set());
  return{divisionOccupancy:dO,facultyOccupancy:fO,roomOccupancy:rO,dailyLoad:dl,weeklyLoad:wl,sessions:[]};
}

function placeSession(state,session){
  const{day,periodIds,divisionId,facultyId,roomId}=session;
  for(const pid of periodIds){const k=slotKey(day,pid);state.divisionOccupancy.get(divisionId).add(k);state.facultyOccupancy.get(facultyId).add(k);state.roomOccupancy.get(roomId).add(k);}
  const dk=`${facultyId}:${day}`;state.dailyLoad.set(dk,(state.dailyLoad.get(dk)||0)+periodIds.length);state.weeklyLoad.set(facultyId,(state.weeklyLoad.get(facultyId)||0)+periodIds.length);
  state.sessions.push(session);
}

function removeLastSession(state){
  const s=state.sessions.pop();if(!s)return;
  const{day,periodIds,divisionId,facultyId,roomId}=s;
  for(const pid of periodIds){const k=slotKey(day,pid);state.divisionOccupancy.get(divisionId).delete(k);state.facultyOccupancy.get(facultyId).delete(k);state.roomOccupancy.get(roomId).delete(k);}
  const dk=`${facultyId}:${day}`;state.dailyLoad.set(dk,(state.dailyLoad.get(dk)||0)-periodIds.length);state.weeklyLoad.set(facultyId,(state.weeklyLoad.get(facultyId)||0)-periodIds.length);
}

function checkConstraints(state,task,day,periodIds,room,faculty,division){
  for(const pid of periodIds){
    const k=slotKey(day,pid);
    if(state.divisionOccupancy.get(task.divisionId)?.has(k))return`Division clash: ${task.divisionId} already busy at ${k}`;
    if(faculty&&state.facultyOccupancy.get(task.facultyId)?.has(k))return`Faculty clash: ${faculty.name} already teaching at ${k}`;
    if(state.roomOccupancy.get(room.id)?.has(k))return`Room clash: ${room.name} already in use at ${k}`;
    if(faculty?.blockedSlots?.has(k))return`Faculty unavailable: ${faculty.name} at ${k}`;
    if(room.blockedSlots?.has(k))return`Room unavailable: ${room.name} at ${k}`;
  }
  if(room.type!==task.requiredRoomType)return`Room type mismatch: need ${task.requiredRoomType}, got ${room.type}`;
  if(division){const rs=(room.type==='lab')?(division.practicalBatchSize??Math.ceil(division.strength/2)):division.strength;if(room.capacity<rs)return`Room capacity insufficient: ${room.capacity}<${rs}`;}
  if(faculty){
    const dk=`${faculty.id}:${day}`;const cd=state.dailyLoad.get(dk)||0;
    if(cd+periodIds.length>faculty.maxPeriodsPerDay)return`Faculty daily load exceeded: ${faculty.name} on ${day}`;
    const cw=state.weeklyLoad.get(faculty.id)||0;if(cw+periodIds.length>faculty.maxPeriodsPerWeek)return`Faculty weekly load exceeded: ${faculty.name}`;
  }
  return null;
}

function backtrack(tasks,index,state,config,roomMap,facultyMap,divisionMap,periodMap,bt){
  if(index===tasks.length)return true;
  if(bt.count>=config.maxBacktracks)return false;
  const task=tasks[index];
  const faculty=facultyMap.get(task.facultyId),division=divisionMap.get(task.divisionId);
  const raw=generateCandidates(task,config,roomMap,facultyMap,periodMap);
  raw.sort((a,b)=>a.prefScore-b.prefScore);
  for(const cand of raw){
    const{day,startPeriodId,room}=cand;
    const periodIds=task.periodsRequired===1?[startPeriodId]:(getConsecutivePeriods(startPeriodId,task.periodsRequired,config.schedulablePeriodIds,periodMap)||[]);
    if(!periodIds.length)continue;
    if(checkConstraints(state,task,day,periodIds,room,faculty,division))continue;
    const session={taskId:task.id,divisionId:task.divisionId,subjectId:task.subjectId,subjectName:task.subjectName,sessionType:task.sessionType,facultyId:task.facultyId,roomId:room.id,day,periodIds};
    placeSession(state,session);
    if(backtrack(tasks,index+1,state,config,roomMap,facultyMap,divisionMap,periodMap,bt))return true;
    removeLastSession(state);bt.count++;
  }
  return false;
}

function diagnose(unscheduledTasks,state,config,roomMap,facultyMap,periodMap){
  const messages=[],suggestions=[];
  for(const task of unscheduledTasks){
    const faculty=facultyMap.get(task.facultyId);
    const rc=generateCandidates(task,config,roomMap,facultyMap,periodMap);
    messages.push(`[${task.id}] ${task.divisionId}/${task.subjectName} (${task.sessionType}) – ${rc.length} structural slot(s)`);
    if(rc.length===0){
      messages.push(`  → No structural slot exists (check faculty/room availability and type).`);
      if(faculty){const wk=state.weeklyLoad.get(faculty.id)||0;messages.push(`  → ${faculty.name} weekly load: ${wk}/${faculty.maxPeriodsPerWeek}`);if(wk>=faculty.maxPeriodsPerWeek)suggestions.push(`Increase weekly load limit for ${faculty.name}, or assign another faculty.`);}
      if(!config.rooms.some(r=>r.type===task.requiredRoomType))suggestions.push(`Add a ${task.requiredRoomType} for ${task.subjectName}.`);
    }
  }
  if(unscheduledTasks.some(t=>t.sessionType==='practical'))suggestions.push('Practical blocks need consecutive free periods. Consider adding more lab rooms or spreading subjects.');
  return{messages,suggestions};
}

function schedule(config){
  const roomMap=indexBy(config.rooms,r=>r.id),facultyMap=indexBy(config.faculty,f=>f.id),divisionMap=indexBy(config.divisions,d=>d.id),periodMap=indexBy(config.periods,p=>p.id);
  const rawTasks=expandTasks(config);
  const tasks=sortByMCV(rawTasks,config,roomMap,facultyMap,periodMap);
  const state=createState(config);const bt={count:0};
  const success=backtrack(tasks,0,state,config,roomMap,facultyMap,divisionMap,periodMap,bt);
  const searchLimitReached=!success&&bt.count>=config.maxBacktracks;
  const scheduledIds=new Set(state.sessions.map(s=>s.taskId));
  const unscheduledTasks=tasks.filter(t=>!scheduledIds.has(t.id));
  const{messages:diagnosticMessages,suggestions}=diagnose(unscheduledTasks,state,config,roomMap,facultyMap,periodMap);
  let status=unscheduledTasks.length===0?'complete':state.sessions.length>0?'partial':'failed';
  return{status,sessions:state.sessions,unscheduledTasks,validationErrors:[],stats:{backtracks:bt.count,searchLimitReached,totalTasks:tasks.length,scheduledCount:state.sessions.length},diagnosticMessages,suggestions};
}

/* ═══════════════════════════════════════════════════════════════
   ██████  VALIDATOR  (verbatim from validator.js)
═══════════════════════════════════════════════════════════════ */
function validate(sessions,config){
  const errors=[];
  const roomMap=indexBy(config.rooms,r=>r.id),facultyMap=indexBy(config.faculty,f=>f.id),divisionMap=indexBy(config.divisions,d=>d.id),subjectMap=indexBy(config.subjects,s=>s.id),periodMap=indexBy(config.periods,p=>p.id);
  const workingDaySet=new Set(config.workingDays);
  const divisionSlots=new Map(),facultySlots=new Map(),roomSlots=new Map();
  const facultyDailyLoad=new Map(),facultyWeeklyLoad=new Map();
  function addOcc(map,key,tid){if(!map.has(key))map.set(key,[]);map.get(key).push(tid);}
  function verr(code,msg,ctx){return{code,message:msg,context:ctx};}

  for(const session of sessions){
    const{taskId,divisionId,subjectId,subjectName,sessionType,facultyId,roomId,day,periodIds}=session;
    const division=divisionMap.get(divisionId),faculty=facultyMap.get(facultyId),room=roomMap.get(roomId),subject=subjectMap.get(subjectId);
    if(!division){errors.push(verr('V01',`Unknown division '${divisionId}'`,{taskId}));continue;}
    if(!faculty)errors.push(verr('V01',`Unknown faculty '${facultyId}'`,{taskId}));
    if(!room){errors.push(verr('V01',`Unknown room '${roomId}'`,{taskId}));continue;}
    if(!subject)errors.push(verr('V01',`Unknown subject '${subjectId}'`,{taskId}));
    if(!workingDaySet.has(day))errors.push(verr('V02',`Session on non-working day '${day}'`,{taskId,day}));
    let prev=null;
    for(const pid of periodIds){
      const period=periodMap.get(pid);
      if(!period){errors.push(verr('V03',`Unknown period ${pid}`,{taskId}));continue;}
      if(period.type!=='lecture')errors.push(verr('V03',`Session in ${period.type} slot (period ${pid})`,{taskId,pid}));
      if(prev!==null&&pid!==prev+1)errors.push(verr('V11',`Practical periods not consecutive: ${prev}→${pid}`,{taskId}));
      if(prev!==null){for(let c=prev+1;c<pid;c++){const b=periodMap.get(c);if(b&&b.type!=='lecture')errors.push(verr('V12',`Practical spans ${b.type} at period ${c}`,{taskId}));}}
      prev=pid;
    }
    for(const pid of periodIds){
      const k=`${day}:${pid}`;
      addOcc(divisionSlots,`${divisionId}|${k}`,taskId);
      if(faculty)addOcc(facultySlots,`${facultyId}|${k}`,taskId);
      addOcc(roomSlots,`${roomId}|${k}`,taskId);
      if(faculty?.blockedSlots?.has(slotKey(day,pid)))errors.push(verr('V07',`Faculty '${faculty.name}' unavailable at ${slotKey(day,pid)}`,{taskId}));
      if(room.blockedSlots?.has(slotKey(day,pid)))errors.push(verr('V08',`Room '${room.name}' unavailable at ${slotKey(day,pid)}`,{taskId}));
    }
    const req=sessionType==='practical'?(subject?.labRoomType||'lab'):(subject?.roomType||'classroom');
    if(room.type!==req)errors.push(verr('V09',`Room type mismatch for ${taskId}: need '${req}', room is '${room.type}'`,{taskId,roomId,requiredType:req,actual:room.type}));
    const rs=(room.type==='lab')?(division.practicalBatchSize??Math.ceil(division.strength/2)):division.strength;
    if(room.capacity<rs)errors.push(verr('V10',`Room '${room.name}' capacity ${room.capacity}<${rs}`,{taskId}));
    if(faculty){const dk=`${facultyId}:${day}`;facultyDailyLoad.set(dk,(facultyDailyLoad.get(dk)||0)+periodIds.length);facultyWeeklyLoad.set(facultyId,(facultyWeeklyLoad.get(facultyId)||0)+periodIds.length);}
  }
  for(const[key,ids]of divisionSlots.entries())if(ids.length>1)errors.push(verr('V04',`Division clash at ${key.split('|')[1]} for ${key.split('|')[0]} — tasks: ${ids.join(', ')}`,{key,taskIds:ids}));
  for(const[key,ids]of facultySlots.entries())if(ids.length>1)errors.push(verr('V05',`Faculty clash at ${key.split('|')[1]} for ${key.split('|')[0]} — tasks: ${ids.join(', ')}`,{key,taskIds:ids}));
  for(const[key,ids]of roomSlots.entries())if(ids.length>1)errors.push(verr('V06',`Room clash at ${key.split('|')[1]} for ${key.split('|')[0]} — tasks: ${ids.join(', ')}`,{key,taskIds:ids}));
  for(const f of config.faculty){
    for(const day of config.workingDays){const c=facultyDailyLoad.get(`${f.id}:${day}`)||0;if(c>f.maxPeriodsPerDay)errors.push(verr('V14',`${f.name} daily load on ${day}: ${c}>max ${f.maxPeriodsPerDay}`,{facultyId:f.id,day,count:c,max:f.maxPeriodsPerDay}));}
    const wk=facultyWeeklyLoad.get(f.id)||0;if(wk>f.maxPeriodsPerWeek)errors.push(verr('V15',`${f.name} weekly load: ${wk}>max ${f.maxPeriodsPerWeek}`,{facultyId:f.id,count:wk,max:f.maxPeriodsPerWeek}));
  }
  // V13 session counts
  const req=expandTasks(config);
  const rcm=new Map(),scm=new Map();
  for(const t of req){const k=`${t.divisionId}:${t.subjectId}:${t.sessionType}`;rcm.set(k,(rcm.get(k)||0)+1);}
  for(const s of sessions){const k=`${s.divisionId}:${s.subjectId}:${s.sessionType}`;scm.set(k,(scm.get(k)||0)+1);}
  for(const[k,r]of rcm.entries()){const s=scm.get(k)||0;if(s!==r){const[di,si,st]=k.split(':');errors.push(verr('V13',`${di}/${si}/${st}: required ${r}, scheduled ${s}`,{divisionId:di,subjectId:si,sessionType:st,required:r,scheduled:s}));}}
  for(const[k,s]of scm.entries()){if(!rcm.has(k)){const[di,si,st]=k.split(':');errors.push(verr('V13',`${di}/${si}/${st}: ${s} extra session(s) not required`,{divisionId:di,subjectId:si,sessionType:st,required:0,scheduled:s}));}}
  const totalRequired=req.length,totalScheduled=sessions.length;
  return{valid:errors.length===0,complete:totalScheduled===totalRequired&&!errors.some(e=>e.code==='V13'),errors,summary:{totalErrors:errors.length,totalRequired,totalScheduled,errorsByCode:errors.reduce((a,e)=>{a[e.code]=(a[e.code]||0)+1;return a;},{})}};
}

   ██████  EDITOR  (verbatim from editor.js)
═══════════════════════════════════════════════════════════════ */
function rebuildState(sessions,config){const s=createState(config);for(const sess of sessions)placeSession(s,sess);return s;}

function proposeMove(sessions,config,moveSpec){
  const roomMap=indexBy(config.rooms,r=>r.id),facultyMap=indexBy(config.faculty,f=>f.id),divisionMap=indexBy(config.divisions,d=>d.id),periodMap=indexBy(config.periods,p=>p.id),subjectMap=indexBy(config.subjects,s=>s.id);
  const original=sessions.find(s=>s.taskId===moveSpec.taskId);
  if(!original)return{accepted:false,reason:`Session '${moveSpec.taskId}' not found.`,originalSession:null,proposedSession:null,violations:[]};
  const newDay=moveSpec.newDay??original.day,newStart=moveSpec.newStartPeriodId??original.periodIds[0],newRoomId=moveSpec.newRoomId??original.roomId;
  const room=roomMap.get(newRoomId);
  if(!room)return{accepted:false,reason:`Unknown room '${newRoomId}'.`,originalSession:original,proposedSession:null,violations:[`Room '${newRoomId}' not found.`]};
  const pr=original.periodIds.length;let newPeriodIds;
  if(pr===1){const p=periodMap.get(newStart);if(!p||p.type!=='lecture')return{accepted:false,reason:`Period ${newStart} is not schedulable.`,originalSession:original,proposedSession:null,violations:[`Period ${newStart} is ${p?.type??'unknown'}.`]};newPeriodIds=[newStart];}
  else{newPeriodIds=getConsecutivePeriods(newStart,pr,config.schedulablePeriodIds,periodMap);if(!newPeriodIds)return{accepted:false,reason:`Cannot fit ${pr} consecutive periods starting at ${newStart}.`,originalSession:original,proposedSession:null,violations:['Consecutive period requirement not met.']};}
  const sw=sessions.filter(s=>s.taskId!==original.taskId);
  const state=rebuildState(sw,config);
  const proposed={...original,day:newDay,periodIds:newPeriodIds,roomId:newRoomId};
  const faculty=facultyMap.get(original.facultyId),division=divisionMap.get(original.divisionId);
  const subj=subjectMap.get(original.subjectId);
  const task={id:original.taskId,divisionId:original.divisionId,subjectId:original.subjectId,sessionType:original.sessionType,facultyId:original.facultyId,requiredRoomType:original.sessionType==='practical'?(subj?.labRoomType||'lab'):(subj?.roomType||'classroom'),periodsRequired:pr};
  const viol=checkConstraints(state,task,newDay,newPeriodIds,room,faculty,division);
  if(viol)return{accepted:false,reason:`Move rejected: ${viol}`,originalSession:original,proposedSession:proposed,violations:[viol]};
  return{accepted:true,reason:`Move accepted: ${original.taskId}→${newDay}[${newPeriodIds.join(',')}] in ${room.name}.`,originalSession:original,proposedSession:proposed,violations:[]};
}

function applyMove(sessions,proposal){
  if(!proposal.accepted)throw new Error(`Cannot apply rejected proposal: ${proposal.reason}`);
  return sessions.filter(s=>s.taskId!==proposal.originalSession.taskId).concat([proposal.proposedSession]);
}

/* ═══════════════════════════════════════════════════════════════
   ██████  TOAST
═══════════════════════════════════════════════════════════════ */
function showToast(msg,type='info',duration=3500){
  const colors={success:'#059669',warn:'#d97706',danger:'#dc2626',info:'#0284c7'};
  const icons={success:'✓',warn:'⚠',danger:'✕',info:'ℹ'};
  const el=document.createElement('div');
  el.style.cssText=`background:${colors[type]||colors.info};color:#fff;padding:.6rem 1rem;border-radius:8px;font-size:.84rem;font-weight:600;display:flex;gap:.5rem;align-items:center;box-shadow:0 4px 12px rgba(0,0,0,.2);pointer-events:auto;animation:fadeInUp .2s ease`;
  el.innerHTML=`<span>${icons[type]||icons.info}</span><span>${msg}</span>`;
  const style=document.createElement('style');
  style.textContent='@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}';
  document.head.appendChild(style);
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},duration);
}

  const prev=APP.lastResult;
  return`

  <div class="stats-grid" style="margin-bottom:.5rem">
    <div class="stat-card"><div class="stat-value">${tasks.length}</div><div class="stat-label">Total Sessions Required</div></div>
    <div class="stat-card sky"><div class="stat-value">${lectures}</div><div class="stat-label">Lecture Sessions</div></div>
    <div class="stat-card green"><div class="stat-value">${practicals}</div><div class="stat-label">Practical Blocks</div></div>

  </div>
</div>

  <div class="card-title">⚡ Run Scheduler</div>
  <p style="font-size:.84rem;color:var(--c-muted);margin-bottom:1rem">
    The engine uses constraint-based backtracking with MCV (Most Constrained Variable) ordering.
    Practical blocks are scheduled first. All hard constraints (room type, faculty clashes, load limits, consecutive periods) are enforced.
  </p>
  <button class="btn btn-primary" id="run-btn" onclick="runScheduler()">
    ⚡ Generate Timetable
  </button>
  <div id="gen-result" style="margin-top:1rem">
    ${prev?renderGenerationResult(prev):''}
  </div>
</div>`;
}

function renderGenerationResult(result){
  const statusColor={complete:'success',partial:'warn',failed:'danger'}[result.status]||'info';
  const statusIcon={complete:'✅',partial:'⚠️',failed:'❌'}[result.status]||'ℹ️';
  let html=`
  <div class="alert alert-${statusColor}">
    <span class="alert-icon">${statusIcon}</span>
    <div>
      <strong>Status: ${result.status.toUpperCase()}</strong><br>
      ${result.stats.scheduledCount} / ${result.stats.totalTasks} sessions scheduled &nbsp;·&nbsp;
      ${result.stats.backtracks} backtracks &nbsp;·&nbsp;
      ${result.stats.searchLimitReached?'<strong>⚠ Search limit reached (result may be incomplete, not necessarily infeasible)</strong>':'Search completed'}
    </div>
  </div>`;

  if(APP.validationReport){
    const vr=APP.validationReport;
    html+=`<div class="alert alert-${vr.valid?'success':'danger'}">
      <span class="alert-icon">${vr.valid?'✅':'❌'}</span>
      <div><strong>Independent Validation: ${vr.valid?'PASSED':'FAILED'}</strong><br>
      ${vr.errors.length} error(s) &nbsp;·&nbsp; ${vr.summary.totalScheduled}/${vr.summary.totalRequired} sessions present
      ${vr.valid?'<br>All hard constraints verified by independent validator.':''}
      </div>
    </div>`;
  }

  if(result.unscheduledTasks.length>0){
    html+=`<div class="card" style="margin-top:.75rem"><div class="card-title">⚠️ Unscheduled Sessions (${result.unscheduledTasks.length})</div>
    <div class="data-table"><table>
      <thead><tr><th>Task</th><th>Division</th><th>Subject</th><th>Type</th><th>Faculty</th></tr></thead>
      <tbody>
        ${result.unscheduledTasks.map(t=>{
          const fName=APP.data.faculty.find(f=>f.id===t.facultyId)?.name||t.facultyId;
          return`<tr>
            <td><code>${t.id}</code></td>
            <td>${t.divisionId}</td>
            <td>${t.subjectName}</td>
            <td><span class="badge badge-${t.sessionType}">${t.sessionType}</span></td>
            <td>${fName}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div></div>`;
  }

  if(result.diagnosticMessages.length>0){
    html+=`<div class="card" style="margin-top:.75rem"><div class="card-title">🔍 Diagnostics</div>
    <pre style="font-size:.75rem;white-space:pre-wrap;color:var(--c-muted)">${result.diagnosticMessages.join('\n')}</pre></div>`;
  }

  if(result.suggestions.length>0){
    const uniq=[...new Set(result.suggestions)];
    html+=`<div class="card" style="margin-top:.75rem"><div class="card-title">💡 Suggestions</div>
    <ul class="err-list">${uniq.map(s=>`<li class="err-item"><span class="err-code" style="background:var(--c-info-l);color:var(--c-info)">TIP</span>${s}</li>`).join('')}</ul></div>`;
  }

  if(result.status!=='failed'){
    html+=`<div style="margin-top:.75rem;display:flex;gap:.5rem;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="navigateTo('timetable')">📅 View Timetable</button>
      <button class="btn btn-ghost" onclick="navigateTo('validate')">✅ Validation Report</button>
      <button class="btn btn-ghost" onclick="exportCSV()">📤 Export CSV</button>
      <button class="btn btn-ghost" onclick="window.print()">🖨 Print</button>
    </div>`;
  }
  return html;
}

function runScheduler(){
  const btn=document.getElementById('run-btn');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span> Scheduling…';
  setTimeout(()=>{
    try{
      const cfg=getConfig();
      if(cfg.divisions.length===0)return showToast('Add at least one division first','danger');
      if(cfg.subjects.length===0)return showToast('Add at least one subject first','danger');
      if(cfg.assignments.length===0)return showToast('Add at least one assignment first','danger');
      const result=schedule(cfg);
      APP.lastResult=result;
      const vr=validate(result.sessions,cfg);
      APP.validationReport=vr;
      result.validationErrors=vr.errors;
      saveState();
      document.getElementById('gen-result').innerHTML=renderGenerationResult(result);
      showToast(`Timetable ${result.status}: ${result.stats.scheduledCount}/${result.stats.totalTasks} sessions`,
        result.status==='complete'?'success':result.status==='partial'?'warn':'danger',5000);
    }catch(e){
      console.error(e);
      document.getElementById('gen-result').innerHTML=`<div class="alert alert-danger"><span class="alert-icon">❌</span><div><strong>Error:</strong> ${e.message}</div></div>`;
      showToast('Scheduling error: '+e.message,'danger');
    }finally{
      btn.disabled=false;btn.innerHTML='⚡ Generate Timetable';
    }
  },50);
}

function switchTTTab(el,tab){
  document.querySelectorAll('[data-tt-tab]').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tt-view-mode').textContent=tab;
  document.getElementById('tt-class-filter').style.display=tab==='class'?'flex':'none';
  document.getElementById('tt-fac-filter').style.display=tab==='faculty'?'flex':'none';
  document.getElementById('tt-rm-filter').style.display=tab==='room'?'flex':'none';
  renderTTGrid();
}

function renderTTGrid(){
  const container=document.getElementById('tt-grid-container');
  if(!container||!APP.lastResult)return;
  const mode=document.getElementById('tt-view-mode')?.textContent||'class';
  let filterKey,filterVal;
  if(mode==='class'){filterKey='divisionId';filterVal=document.getElementById('tt-div-sel')?.value;}
  else if(mode==='faculty'){filterKey='facultyId';filterVal=document.getElementById('tt-fac-sel')?.value;}
  else{filterKey='roomId';filterVal=document.getElementById('tt-rm-sel')?.value;}

  const sessions=APP.lastResult.sessions.filter(s=>s[filterKey]===filterVal);
  const d=APP.data;
  const days=d.workingDays;
  const periods=d.periods;

  // Build lookup: day → periodId → session
  const lookup=new Map();
  for(const s of sessions){
    for(const pid of s.periodIds){
      const k=`${s.day}:${pid}`;
      lookup.set(k,s);
    }
  }

  const fName=id=>d.faculty.find(f=>f.id===id)?.name?.split(' ').slice(-1)[0]||id;
  const rName=id=>d.rooms.find(r=>r.id===id)?.name||id;
  const dName=id=>d.divisions.find(dv=>dv.id===id)?.name||id;

  let html=`<div class="tt-wrap" id="print-area"><div class="tt-grid"><table>
    <thead><tr>
      <th class="tt-period-label">Period</th>
      ${days.map(day=>`<th>${day}</th>`).join('')}
    </tr></thead>
    <tbody>`;

  for(const period of periods){
    html+=`<tr><td class="tt-period-label"><div>${period.label}</div></td>`;
    for(const day of days){
      const k=`${day}:${period.id}`;
      const sess=lookup.get(k);
      if(period.type==='break'){
        html+=`<td><div class="tt-cell-break">☕ Break</div></td>`;
      }else if(period.type==='lunch'){
        html+=`<td><div class="tt-cell-lunch">🍽 Lunch</div></td>`;
      }else if(sess){
        // Check if this is the first period of a practical block
        const isFirstPeriod=sess.periodIds[0]===period.id;
        const isPractical=sess.sessionType==='practical';
        const rowspan=isPractical&&isFirstPeriod?sess.periodIds.length:1;
        if(isPractical&&!isFirstPeriod){
          // Skip – already covered by rowspan
          continue;
        }
        const detail=mode==='class'?`${fName(sess.facultyId)} · ${rName(sess.roomId)}`:
          mode==='faculty'?`${dName(sess.divisionId)} · ${rName(sess.roomId)}`:
          `${dName(sess.divisionId)} · ${fName(sess.facultyId)}`;
        html+=`<td ${rowspan>1?`rowspan="${rowspan}"`:''}><div class="tt-cell-${isPractical?'practical':'lecture'}" onclick="openSessionEdit('${sess.taskId}')">
          <div class="tt-subj ${isPractical?'tt-practical':''}">${sess.subjectName}</div>
          <div class="tt-detail">${detail}</div>
          ${isPractical?`<div style="font-size:.6rem;color:var(--c-success);font-weight:600">PRACTICAL ×${sess.periodIds.length}</div>`:''}
        </div></td>`;
      }else{
        html+=`<td><div class="tt-cell-free"></div></td>`;
      }
    }
    html+=`</tr>`;
  }
  html+=`</tbody></table></div></div>`;
  container.innerHTML=html;
}

/* ═══════════════════════════════════════════════════════════════
   ██████  MANUAL SESSION EDIT
═══════════════════════════════════════════════════════════════ */
function openSessionEdit(taskId){
  const sessions=APP.lastResult?.sessions;
  if(!sessions)return;
  const session=sessions.find(s=>s.taskId===taskId);
  if(!session)return;
  const d=APP.data;
  const fName=id=>d.faculty.find(f=>f.id===id)?.name||id;
  const rName=id=>d.rooms.find(r=>r.id===id)?.name||id;
  const dName=id=>d.divisions.find(dv=>dv.id===id)?.name||id;
  const lectPeriods=d.periods.filter(p=>p.type==='lecture');
  const compatRooms=d.rooms.filter(r=>session.sessionType==='practical'?(r.type==='lab'):(r.type==='classroom'));

  openModal(`✏ Edit Session – ${session.subjectName}`,`
    <div style="background:var(--c-bg);border-radius:var(--radius);padding:.75rem;margin-bottom:1rem;font-size:.82rem">
      <strong>Current:</strong> ${dName(session.divisionId)} · ${session.sessionType} · 
      ${session.day} period(s) [${session.periodIds.join(',')}] · ${rName(session.roomId)}<br>
      <strong>Faculty:</strong> ${fName(session.facultyId)}
    </div>
    <div class="form-row">
      <div class="form-group"><label>New Day</label>
        <select id="edit-day">
          ${d.workingDays.map(day=>`<option value="${day}" ${session.day===day?'selected':''}>${day}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label>New Start Period</label>
        <select id="edit-period">
          ${lectPeriods.map(p=>`<option value="${p.id}" ${session.periodIds[0]===p.id?'selected':''}>${p.label}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label>New Room (${session.sessionType==='practical'?'lab':'classroom'} only)</label>
        <select id="edit-room">
          ${compatRooms.map(r=>`<option value="${esc(r.id)}" ${session.roomId===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div id="edit-result"></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn btn-warn" onclick="previewMove('${taskId}')">👁 Preview Move</button>
     <button class="btn btn-primary" id="apply-move-btn" style="display:none" onclick="applySessionMove('${taskId}')">✓ Apply Move</button>`);
}

let _pendingProposal=null;

function previewMove(taskId){
  const newDay=document.getElementById('edit-day').value;
  const newStart=parseInt(document.getElementById('edit-period').value);
  const newRoom=document.getElementById('edit-room').value;
  const cfg=getConfig();
  const proposal=proposeMove(APP.lastResult.sessions,cfg,{taskId,newDay,newStartPeriodId:newStart,newRoomId:newRoom});
  _pendingProposal=proposal;
  const resEl=document.getElementById('edit-result');
  const applyBtn=document.getElementById('apply-move-btn');
  if(proposal.accepted){
    resEl.innerHTML=`<div class="alert alert-success"><span class="alert-icon">✅</span><div><strong>Move Valid</strong><br>${proposal.reason}</div></div>`;
    applyBtn.style.display='inline-flex';
  }else{
    resEl.innerHTML=`<div class="alert alert-danger"><span class="alert-icon">❌</span><div><strong>Move Rejected</strong><br>${proposal.reason}<br><em>${proposal.violations.join('; ')}</em></div></div>`;
    applyBtn.style.display='none';
  }
}

function applySessionMove(taskId){
  if(!_pendingProposal||!_pendingProposal.accepted)return showToast('No valid proposal to apply','danger');
  try{
    const newSessions=applyMove(APP.lastResult.sessions,_pendingProposal);
    APP.lastResult.sessions=newSessions;
    // Re-run validator
    const cfg=getConfig();
    const vr=validate(newSessions,cfg);
    APP.validationReport=vr;
    _pendingProposal=null;
    closeModal();
    renderPage('timetable');
    showToast('Session moved successfully','success');
    saveState();
  }catch(e){showToast('Apply failed: '+e.message,'danger');}
}

/* ═══════════════════════════════════════════════════════════════
   ██████  VALIDATION PAGE
═══════════════════════════════════════════════════════════════ */
function pageValidate(){
  if(!APP.lastResult||APP.lastResult.sessions.length===0){
    return`<div class="page-header"><div class="page-title">✅ Validation</div></div>
    <div class="empty-state"><div class="empty-icon">✅</div><div class="empty-title">No timetable to validate</div>
    <div class="empty-sub">Generate a timetable first</div>
    <br><button class="btn btn-primary" onclick="navigateTo('generate')">⚡ Generate</button></div>`;
  }

  const cfg=getConfig();
  const report=validate(APP.lastResult.sessions,cfg);
  APP.validationReport=report;

  const byCode={};
  for(const e of report.errors)byCode[e.code]=(byCode[e.code]||[]).concat(e);

  const codeDesc={
    V01:'Invalid references',V02:'Non-working day',V03:'Break/lunch period',
    V04:'Division clash',V05:'Faculty clash',V06:'Room clash',
    V07:'Faculty unavailable',V08:'Room unavailable',V09:'Room type mismatch',
    V10:'Room capacity',V11:'Non-consecutive practical',V12:'Practical spans break',
    V13:'Session count mismatch',V14:'Faculty daily load',V15:'Faculty weekly load'
  };

  return`
<div class="page-header">
  <div><div class="page-title">✅ Independent Validation</div>
  <div class="page-sub">Checks all constraints independently from the scheduler</div></div>
  <button class="btn btn-primary btn-sm" onclick="renderPage('validate')">↺ Re-Validate</button>
</div>

<div class="stats-grid">
  <div class="stat-card ${report.valid?'green':'red'}">
    <div class="stat-value">${report.valid?'PASS':'FAIL'}</div>
    <div class="stat-label">Overall Status</div>
  </div>
  <div class="stat-card ${report.complete?'green':'amber'}">
    <div class="stat-value">${report.complete?'YES':'NO'}</div>
    <div class="stat-label">Complete</div>
  </div>
  <div class="stat-card ${report.errors.length?'red':'green'}">
    <div class="stat-value">${report.errors.length}</div>
    <div class="stat-label">Total Errors</div>
  </div>
  <div class="stat-card">
    <div class="stat-value">${report.summary.totalScheduled}/${report.summary.totalRequired}</div>
    <div class="stat-label">Sessions Scheduled</div>
  </div>
</div>

${report.valid?`<div class="alert alert-success"><span class="alert-icon">✅</span><div><strong>All constraints pass.</strong> The timetable is valid and complete.</div></div>`:''}

${Object.keys(byCode).length?`
<div class="card">
  <div class="card-title">❌ Validation Errors by Category</div>
  ${Object.entries(byCode).map(([code,errs])=>`
    <div style="margin-bottom:1rem">
      <div style="display:flex;gap:.5rem;align-items:center;margin-bottom:.4rem">
        <span class="err-code">${code}</span>
        <strong style="font-size:.85rem">${codeDesc[code]||code}</strong>
        <span class="badge badge-danger">${errs.length}</span>
      </div>
      <ul class="err-list">
        ${errs.map(e=>`<li class="err-item"><span class="err-code">${e.code}</span>${e.message}</li>`).join('')}
      </ul>
    </div>
  `).join('')}
</div>`:''}

<div class="card">
  <div class="card-title">📊 All 15 Checks Status</div>
  <div class="data-table"><table>
    <thead><tr><th>Code</th><th>Check</th><th>Status</th><th>Count</th></tr></thead>
    <tbody>
      ${Object.entries(codeDesc).map(([code,desc])=>{
        const cnt=(byCode[code]||[]).length;
        return`<tr>
          <td><span class="err-code">${code}</span></td>
          <td>${desc}</td>
          <td>${cnt===0?'<span class="badge badge-success">✓ Pass</span>':'<span class="badge badge-danger">✕ Fail</span>'}</td>
          <td>${cnt||'—'}</td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div>
</div>`;
}

/* ═══════════════════════════════════════════════════════════════
   ██████  CSV EXPORT
═══════════════════════════════════════════════════════════════ */
function exportCSV(){
  if(!APP.lastResult||!APP.lastResult.sessions.length)return showToast('No timetable to export','warn');
  const d=APP.data;
  const fName=id=>d.faculty.find(f=>f.id===id)?.name||id;
  const rName=id=>d.rooms.find(r=>r.id===id)?.name||id;
  const dName=id=>d.divisions.find(dv=>dv.id===id)?.name||id;

  const rows=[['Division','Subject','Type','Day','Periods','Faculty','Room']];
  for(const s of APP.lastResult.sessions){
    rows.push([dName(s.divisionId),s.subjectName,s.sessionType,s.day,s.periodIds.join(';'),fName(s.facultyId),rName(s.roomId)]);
  }
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='campusflow-timetable.csv';a.click();
  URL.revokeObjectURL(url);
  showToast('CSV exported','success');
}

/* ═══════════════════════════════════════════════════════════════
   ██████  JSON IMPORT / EXPORT
═══════════════════════════════════════════════════════════════ */
function exportJSON(){
  const payload={data:APP.data,lastResult:APP.lastResult?{sessions:APP.lastResult.sessions}:null};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='campusflow-export.json';a.click();
  URL.revokeObjectURL(url);
  showToast('JSON exported','success');
}

function importJSON(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const payload=JSON.parse(e.target.result);
      if(!payload.data)throw new Error('Invalid format: missing "data" key');
      APP.data=payload.data;
      if(payload.lastResult){APP.lastResult=payload.lastResult;APP.validationReport=null;}
      else{APP.lastResult=null;APP.validationReport=null;}
      saveState();
      renderPage(APP.currentPage);
      showToast('JSON imported successfully','success');
    }catch(err){showToast('Import failed: '+err.message,'danger');}
    event.target.value='';
  };
  reader.readAsText(file);
}

/* ═══════════════════════════════════════════════════════════════
   ██████  HELPERS
═══════════════════════════════════════════════════════════════ */
function esc(str){return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function bindPageEvents(page){
  if(page==='timetable'){
    // Auto-render grid once page is in DOM
    setTimeout(()=>{
      if(document.getElementById('tt-grid-container'))renderTTGrid();
    },0);
  }
}

/* ═══════════════════════════════════════════════════════════════
   ██████  INIT
═══════════════════════════════════════════════════════════════ */
(function init(){
  const saved=loadState();
  if(saved){
    APP.data=saved;
    showToast('Data restored from localStorage','info',2000);
  }else{
    APP.data=buildDemoData();
  }
  // localStorage persists only APP.data; timetable result is NOT saved
  // to avoid large storage. Re-generate after import.
  APP.lastResult=null;
  APP.validationReport=null;
  renderPage('dashboard');
})();
</script>
